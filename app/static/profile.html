<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile & Settings</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; }
    button:hover { background: #0056b3; }
    .alert { padding: 10px; margin-bottom: 20px; display: none; border-radius: 4px; }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>
  <h2>User Profile</h2>
  <div id="alertBox" class="alert"></div>

  <form id="profileForm">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" required minlength="3">
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" required>
    </div>
    <button type="submit">Update Profile</button>
  </form>

  <hr style="margin: 30px 0;">

  <h2>Change Password</h2>
  <form id="passwordForm">
    <div class="form-group">
      <label for="currentPassword">Current Password</label>
      <input type="password" id="currentPassword" required minlength="6">
    </div>
    <div class="form-group">
      <label for="newPassword">New Password</label>
      <input type="password" id="newPassword" required minlength="6">
    </div>
    <button type="submit">Change Password</button>
  </form>

  <script>
    function showAlert(msg, isError = false) {
      const box = document.getElementById("alertBox");
      box.textContent = msg;
      box.className = "alert " + (isError ? "error" : "success");
      box.style.display = "block";
    }

    async function loadProfile() {
      const res = await fetch("/api/v1/profile/");
      if (res.ok) {
        const data = await res.json();
        document.getElementById("username").value = data.username;
        document.getElementById("email").value = data.email;
      }
    }

    document.getElementById("profileForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const res = await fetch("/api/v1/profile/", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username: document.getElementById("username").value,
          email: document.getElementById("email").value
        })
      });
      const body = await res.json();
      if (res.ok) showAlert("Profile updated successfully!");
      else showAlert(body.detail || "Update failed", true);
    });

    document.getElementById("passwordForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const res = await fetch("/api/v1/profile/password", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          current_password: document.getElementById("currentPassword").value,
          new_password: document.getElementById("newPassword").value
        })
      });
      const body = await res.json();
      if (res.ok) {
        showAlert("Password changed successfully!");
        document.getElementById("passwordForm").reset();
      } else {
        showAlert(body.detail || "Password change failed", true);
      }
    });

    loadProfile();
  </script>
</body>
</html>
